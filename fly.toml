# Fly.io: one always-on machine in Stockholm with a disk for accounts and the world.
# The game keeps its state in memory, so it must never run on more than one machine.
app = 'spacemyst3d'
primary_region = 'arn'
swap_size_mb = 512

[env]
  PORT = '8080'
  DATA_DIR = '/data'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
